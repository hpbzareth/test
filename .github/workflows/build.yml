name: Build WSA Kernel with KernelSU-Next

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'WSA Kernel Branch (để auto để lấy nhánh 5.15 mới nhất)'
        required: true
        default: 'auto'
      ksunext_branch:
        description: 'KernelSU-Next Branch'
        required: true
        default: 'next'

jobs:
  build-kernel:
    runs-on: ubuntu-24.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential flex bison libssl-dev libelf-dev dwarves bc cpio python3 git curl clang lld llvm

      - name: Clone Microsoft WSA Linux Kernel
        run: |
          BRANCH="${{ github.event.inputs.kernel_branch }}"
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "auto" ]; then
            git clone --depth=1 https://github.com/microsoft/WSA-Linux-Kernel.git wsa-kernel
          else
            git clone --depth=1 -b "$BRANCH" https://github.com/microsoft/WSA-Linux-Kernel.git wsa-kernel
          fi
          echo "Active branch: $(git -C wsa-kernel branch --show-current)"

      - name: Setup Kernel Config & Integrate KernelSU-Next
        working-directory: wsa-kernel
        run: |
          if [ -f "Microsoft/config-wsa-x86_64" ]; then
            cp Microsoft/config-wsa-x86_64 .config
          else
            FOUND_CFG=$(find Microsoft arch/x86/configs -maxdepth 2 -type f -name "*wsa*x86*" 2>/dev/null | head -n 1)
            if [ -n "$FOUND_CFG" ]; then
              echo "Loaded config: $FOUND_CFG"
              cp "$FOUND_CFG" .config
            else
              echo "Không tìm thấy config WSA. Danh sách file hiện có:"
              ls -la Microsoft/ arch/x86/configs/ 2>/dev/null || true
              exit 1
            fi
          fi

          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s "${{ github.event.inputs.ksunext_branch }}"

          scripts/config --disable CONFIG_WERROR
          scripts/config --enable CONFIG_KPROBES
          scripts/config --enable CONFIG_HAVE_KPROBES
          scripts/config --enable CONFIG_KPROBE_EVENTS
          scripts/config --enable CONFIG_OVERLAY_FS
          scripts/config --enable CONFIG_KSU

          make LLVM=1 olddefconfig
          grep -E "CONFIG_KSU=|CONFIG_KPROBES=" .config

      - name: Compile bzImage
        working-directory: wsa-kernel
        run: |
          make LLVM=1 -j"$(nproc)" bzImage
          mkdir -p ../output
          cp arch/x86/boot/bzImage ../output/kernel

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WSA-KernelSU-Next-kernel
          path: output/kernel
          retention-days: 14
