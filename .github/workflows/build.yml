name: Build WSA 5.15 Kernel with KernelSU-Next v3.4.2

on:
  push:
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      ksunext_tag:
        description: 'KernelSU-Next Tag'
        required: true
        default: 'v3.4.2'
      wsa_tag:
        description: 'WSA Kernel Tag'
        required: true
        default: 'android-lts/latte-2/5.15.104.4'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential flex libelf-dev libssl-dev libncurses-dev \
            dwarves cpio git curl clang-14 lld-14 llvm-14
          sudo ln -sf /usr/bin/clang-14 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-14 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-ar-14 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-strip-14 /usr/bin/llvm-strip
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/bin/llvm-objcopy

      - name: Clone Microsoft WSA Linux Kernel
        run: |
          TAG="${{ github.event.inputs.wsa_tag || 'android-lts/latte-2/5.15.104.4' }}"
          git clone --depth=1 -b "$TAG" https://github.com/microsoft/WSA-Linux-Kernel.git wsa-kernel

      - name: Setup Kernel Config & Integrate KernelSU-Next v3.4.2
        working-directory: wsa-kernel
        run: |
          # 1. Nap cau hinh WSA x86_64 chinh thuc cua Microsoft
          cp configs/wsa/config-wsa-x64 .config

          # 2. Tich hop KernelSU-Next tag v3.4.2
          KSU_TAG="${{ github.event.inputs.ksunext_tag || 'v3.4.2' }}"
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "$KSU_TAG"

          # 3. Kich hoat KSU va toi uu config
          scripts/config --enable CONFIG_KSU
          scripts/config --enable CONFIG_KPROBES
          scripts/config --enable CONFIG_HAVE_KPROBES
          scripts/config --enable CONFIG_KPROBE_EVENTS
          scripts/config --enable CONFIG_OVERLAY_FS
          scripts/config --disable CONFIG_WERROR
          scripts/config --set-str CONFIG_LOCALVERSION "-ksunext"
          sed -i 's/-dirty//' scripts/setlocalversion || true

          make LLVM=1 olddefconfig
          grep -E "CONFIG_KSU=|CONFIG_KPROBES=" .config

      - name: Compile bzImage
        working-directory: wsa-kernel
        run: |
          make LLVM=1 -j"$(nproc)" bzImage
          mkdir -p ../output
          cp arch/x86/boot/bzImage ../output/kernel
          ls -lh ../output/kernel

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WSA-5.15-KernelSU-Next-v3.4.2-kernel
          path: output/kernel
          retention-days: 14
