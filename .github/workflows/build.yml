name: Build WSA Kernel with KernelSU-Next

on:
  push:
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'WSA Kernel Branch (để auto để lấy nhánh mặc định)'
        required: true
        default: 'auto'
      ksunext_branch:
        description: 'KernelSU-Next Branch'
        required: true
        default: 'next'

jobs:
  build-kernel:
    runs-on: ubuntu-24.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential flex bison libssl-dev libelf-dev dwarves bc cpio python3 git curl clang lld llvm

      - name: Clone Microsoft WSA Linux Kernel
        run: |
          BRANCH="${{ github.event.inputs.kernel_branch || 'auto' }}"
          if [ "$BRANCH" = "auto" ]; then
            git clone --depth=1 https://github.com/microsoft/WSA-Linux-Kernel.git wsa-kernel
          else
            git clone --depth=1 -b "$BRANCH" https://github.com/microsoft/WSA-Linux-Kernel.git wsa-kernel
          fi
          echo "Active branch: $(git -C wsa-kernel branch --show-current)"

      - name: Setup Kernel Config & Integrate KernelSU-Next
        working-directory: wsa-kernel
        run: |
          # Nạp base GKI defconfig của WSA
          if [ -f "arch/x86/configs/gki_defconfig" ]; then
            cp arch/x86/configs/gki_defconfig .config
          else
            cp arch/x86/configs/x86_64_defconfig .config
          fi

          # Tự động merge thêm fragment config của WSA/Hyper-V nếu có trong repo
          FRAGMENTS=$(find . -maxdepth 4 -type f \( -iname "*wsa*.config" -o -iname "*hyperv*.config" \) 2>/dev/null || true)
          if [ -n "$FRAGMENTS" ]; then
            echo "Merging fragments: $FRAGMENTS"
            ./scripts/kconfig/merge_config.sh -m .config $FRAGMENTS
          fi

          # Tích hợp KernelSU-Next
          KSU_BRANCH="${{ github.event.inputs.ksunext_branch || 'next' }}"
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s "$KSU_BRANCH"

          # Bật KSU, KPROBES, Hyper-V/DXGKRNL và tắt WERROR/LTO để tránh lỗi compile
          scripts/config --disable CONFIG_WERROR
          scripts/config --disable CONFIG_LTO_CLANG_FULL
          scripts/config --disable CONFIG_LTO_CLANG_THIN
          scripts/config --enable CONFIG_LTO_NONE
          scripts/config --enable CONFIG_KPROBES
          scripts/config --enable CONFIG_HAVE_KPROBES
          scripts/config --enable CONFIG_KPROBE_EVENTS
          scripts/config --enable CONFIG_OVERLAY_FS
          scripts/config --enable CONFIG_HYPERV
          scripts/config --enable CONFIG_HYPERV_VMBUS
          scripts/config --enable CONFIG_DXGKRNL
          scripts/config --enable CONFIG_KSU

          make LLVM=1 olddefconfig
          grep -E "CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_DXGKRNL=" .config

      - name: Compile bzImage
        working-directory: wsa-kernel
        run: |
          make LLVM=1 -j"$(nproc)" bzImage
          mkdir -p ../output
          cp arch/x86/boot/bzImage ../output/kernel

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WSA-KernelSU-Next-kernel
          path: output/kernel
          retention-days: 14
