name: Build WSA 5.10 Kernels (Standard & SuSFS)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-5.10.yml'
      - 'patch_wsa_510.py'

permissions:
  contents: write

jobs:
  build-510-standard:
    name: Build Kernel 5.10 (KernelSU-Next v3.4.2)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential flex libelf-dev libssl-dev libncurses-dev \
            dwarves cpio git curl clang-14 lld-14 llvm-14 patch zip python3 rsync
          sudo ln -sf /usr/bin/clang-14 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-14 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-ar-14 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-strip-14 /usr/bin/llvm-strip
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/bin/llvm-objcopy

      - name: Clone WSA 5.10 Kernel
        run: |
          git clone --depth=1 -b android-lts/latte/5.10.136.2 https://github.com/microsoft/WSA-Linux-Kernel.git wsa-kernel

      - name: Setup KernelSU-Next v3.4.2
        working-directory: wsa-kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s v3.4.2

      - name: Configure Kernel 5.10
        working-directory: wsa-kernel
        run: |
          cp configs/wsa/config-wsa-5.10 .config
          scripts/config --enable CONFIG_KSU
          scripts/config --enable CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER
          scripts/config --enable CONFIG_OVERLAY_FS
          scripts/config --enable CONFIG_TMPFS_XATTR
          scripts/config --enable CONFIG_TMPFS_POSIX_ACL
          scripts/config --disable CONFIG_WERROR
          scripts/config --set-str CONFIG_LOCALVERSION "-wsa-ksunext-5.10"
          sed -i 's/-dirty//' scripts/setlocalversion || true
          make LLVM=1 olddefconfig

      - name: Compile Kernel 5.10
        working-directory: wsa-kernel
        run: |
          mkdir -p ../output
          make LLVM=1 -j"$(nproc)" bzImage
          cp arch/x86/boot/bzImage ../output/kernel-5.10-ksunext-v3.4.2

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WSA-5.10-KernelSU-Next-v3.4.2-kernel
          path: output/kernel-5.10-ksunext-v3.4.2
          retention-days: 14

      - name: Upload to Release Revision 1
        run: |
          gh release upload r1 output/kernel-5.10-ksunext-v3.4.2 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-510-susfs:
    name: Build Kernel 5.10 (Built-in SuSFS v2.4.0)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential flex libelf-dev libssl-dev libncurses-dev \
            dwarves cpio git curl clang-14 lld-14 llvm-14 patch zip python3 rsync
          sudo ln -sf /usr/bin/clang-14 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-14 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-ar-14 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-strip-14 /usr/bin/llvm-strip
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/bin/llvm-objcopy

      - name: Clone WSA 5.10 Kernel & SuSFS4KSU
        run: |
          git clone --depth=1 -b android-lts/latte/5.10.136.2 https://github.com/microsoft/WSA-Linux-Kernel.git wsa-kernel
          git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu

      - name: Setup KernelSU & Apply SuSFS Patches
        run: |
          cd wsa-kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s c680b548f3fe5c19f51e90ce97d6f0ef89594421

          # Copy SuSFS files
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/

          # Apply patches
          patch -p1 --forward < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || true
          cd KernelSU
          patch -p1 --forward < ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
          cd ..

          # Apply WSA 5.10 fixes
          python3 ../patch_wsa_510.py

      - name: Configure Kernel 5.10 SuSFS
        working-directory: wsa-kernel
        run: |
          cp configs/wsa/config-wsa-5.10 .config
          scripts/config --enable CONFIG_KSU
          scripts/config --enable CONFIG_KSU_SUSFS
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_PATH
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_MOUNT
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_KSTAT
          scripts/config --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
          scripts/config --enable CONFIG_KSU_SUSFS_ENABLE_LOG
          scripts/config --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          scripts/config --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          scripts/config --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT
          scripts/config --enable CONFIG_KSU_SUSFS_SUS_MAP
          scripts/config --enable CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER
          scripts/config --enable CONFIG_OVERLAY_FS
          scripts/config --enable CONFIG_TMPFS_XATTR
          scripts/config --enable CONFIG_TMPFS_POSIX_ACL
          scripts/config --enable CONFIG_HEADERS_INSTALL
          scripts/config --disable CONFIG_WERROR
          scripts/config --set-str CONFIG_LOCALVERSION "-wsa-susfs-5.10"
          sed -i 's/-dirty//' scripts/setlocalversion || true

          make LLVM=1 olddefconfig
          make LLVM=1 headers_install || true
          if [ ! -f usr/include/linux/unistd.h ]; then
            mkdir -p usr/include
            cp -r include/uapi/* usr/include/
            cp -r arch/x86/include/uapi/* usr/include/
          fi

      - name: Compile Kernel 5.10 SuSFS
        working-directory: wsa-kernel
        run: |
          mkdir -p ../output
          make LLVM=1 -j"$(nproc)" bzImage
          cp arch/x86/boot/bzImage ../output/kernel-5.10-susfs

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WSA-5.10-KernelSU-Builtin-SuSFS-kernel
          path: output/kernel-5.10-susfs
          retention-days: 14

      - name: Upload to Release Revision 1
        run: |
          gh release upload r1 output/kernel-5.10-susfs --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
