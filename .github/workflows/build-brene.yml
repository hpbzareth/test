name: Build BRENE Universal Module (x86_64 & arm64)

on:
  push:
    branches:
      - brene
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-brene:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip curl git file

      - name: Clone SuSFS userspace tool source
        run: |
          git clone --depth=1 -b gki-android13-5.15 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu

      - name: Compile ksu_susfs for arm64-v8a & x86_64
        run: |
          cd susfs4ksu/ksu_susfs
          sed -i 's/APP_ABI := arm64-v8a/APP_ABI := arm64-v8a x86_64/' jni/Application.mk
          ndk-build
          ls -lh libs/arm64-v8a/ksu_susfs libs/x86_64/ksu_susfs
          file libs/x86_64/ksu_susfs

      - name: Clone latest BRENE module
        run: |
          git clone --depth=1 https://github.com/rrr333nnn333/BRENE.git brene-repo

      - name: Patch BRENE for Universal Architecture support
        run: |
          cd brene-repo/module
          python3 ../../patch_brene.py

      - name: Package Universal BRENE Module
        run: |
          mkdir -p output
          cd brene-repo/module
          VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          echo "BRENE_VERSION=${VERSION}" >> $GITHUB_ENV
          zip -r9 ../../output/BRENE-Universal-x86_64-arm64.zip ./*
          cp ../../output/BRENE-Universal-x86_64-arm64.zip "../../output/BRENE-Universal-${VERSION}-x86_64-arm64.zip"
          ls -lh ../../output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BRENE-Universal-x86_64-arm64
          path: output/*.zip
          retention-days: 14

      - name: Upload to Release Revision 1
        run: |
          gh release upload r1 output/BRENE-Universal-x86_64-arm64.zip --clobber
          gh release upload r1 output/BRENE-Universal-${{ env.BRENE_VERSION }}-x86_64-arm64.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
